name: Auto-Fetch Live IPOs

on:
  schedule:
    # Runs at :05 and :35 of every hour from 04:05 UTC (9:35 AM IST) to 13:35 UTC (7:05 PM IST), Mon-Fri.
    # Running 20 times a day guarantees GitHub Actions cannot skip your morning or 5:00 PM IST cutoff updates.
    - cron: '5,35 4-13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-ipos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPO scraper (Headless)
        run: python fetch_ipos.py --headless

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json ipo_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-updated open IPOs" && git push)