name: Auto-Fetch Live IPOs

on:
  schedule:
    # Runs at 4:00, 6:00, 8:00, 10:00, and 12:00 UTC (Mon-Fri)
    # This translates to 9:30 AM, 11:30 AM, 1:30 PM, 3:30 PM, and 5:30 PM IST
    - cron: '0 4,6,8,10,12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  fetch-ipos:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run IPO scraper (Headless)
      run: python fetch_ipos.py --headless

    - name: Commit and push updated data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json ipo_cache.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-updated open IPOs"
        git push