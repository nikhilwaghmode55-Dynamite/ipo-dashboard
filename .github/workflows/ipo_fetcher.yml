name: Auto-Fetch Live IPOs

on:
  schedule:
    # Morning Run 1: 04:30 UTC = 10:00 AM IST (Mon-Fri)
    - cron: '30 4 * * 1-5'
    # Morning Backup Run 2: 05:00 UTC = 10:30 AM IST (Mon-Fri)
    - cron: '0 5 * * 1-5'
    # Evening Cutoff Run 1: 11:35 UTC = 5:05 PM IST (Mon-Fri) — removes IPOs closed at 5 PM
    - cron: '35 11 * * 1-5'
    # Evening Backup Run 2: 12:05 UTC = 5:35 PM IST (Mon-Fri)
    - cron: '5 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  fetch-ipos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPO scraper (Headless)
        run: python fetch_ipos.py --headless

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json ipo_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-updated open and upcoming IPOs" && git push)