name: Update Live IPO Data

on:
  schedule:
    # 10:00 AM IST (04:30 UTC) — Lists new IPOs opening today
    - cron: '30 4 * * *'
    # 10:15 AM IST (04:45 UTC) — Backup morning sync
    - cron: '45 4 * * *'
    # 05:00 PM IST (11:30 UTC) — Removes closed IPOs at 5 PM sharp
    - cron: '30 11 * * *'
    # 05:15 PM IST (11:45 UTC) — Backup evening cleanup
    - cron: '45 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ipos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPO Scraper Engine (Headless)
        env:
          GITHUB_ACTIONS: "true"
        run: python fetch_ipos.py --headless

      - name: Commit and Push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update IPO dashboard data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin main
          fi